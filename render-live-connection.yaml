services:
  - type: worker
    name: capital-connect-live-connection
    runtime: python
    repo: https://github.com/Shagga12/sol-bot
    branch: capital-connect-live-review
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: python -m unittest discover -s tests -q
    startCommand: python -m capital_connect_v1.connection_worker
    disk:
      name: capital-connect-connection-journal
      mountPath: /var/data
      sizeGB: 1
